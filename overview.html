<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AWS AIP-C01 中文题库答题一览：查看已标记、未作答、答对和答错的题目。" />
    <title>答题一览｜AWS AIP-C01 中文题库</title>
    <link rel="stylesheet" href="styles.css?v=question-marks-20260804" />
  </head>
  <body>
    <main class="shell">
      <header class="site-header">
        <a class="brand" href="index.html?question=1" aria-label="回到题库">
          <span class="brand-mark">AI</span>
          <span>AIP-C01 <em>中文题库</em></span>
        </a>
        <a class="overview-back" href="index.html?question=1">返回做题</a>
      </header>

      <section class="overview-heading" aria-labelledby="overview-title">
        <div>
          <p class="section-kicker">学习进度</p>
          <h1 id="overview-title">答题一览</h1>
          <p>按标记和作答状态查看全部题目，点击题号即可继续或重新作答。</p>
        </div>
        <div class="overview-total"><strong id="total-count">0</strong><span>总题数</span></div>
      </section>

      <section class="status-summary" aria-label="答题统计">
        <div class="status-stat marked"><span>已标记</span><strong id="marked-count">0</strong></div>
        <div class="status-stat pending"><span>未作答</span><strong id="unanswered-count">0</strong></div>
        <div class="status-stat correct"><span>答对</span><strong id="correct-count">0</strong></div>
        <div class="status-stat incorrect"><span>答错</span><strong id="incorrect-count">0</strong></div>
      </section>

      <section id="overview-view" class="overview-lists" aria-live="polite"></section>
    </main>

    <script type="module" src="overview.js?v=architecture-20260805"></script>
  </body>
</html>
